# The website (site/) with the browser installer, on GitHub Pages.
# It serves the latest release's binaries itself: GitHub release downloads send no CORS headers,
# so ESP Web Tools could not fetch them from the releases page. Needs Settings → Pages → Source:
# GitHub Actions.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'firmware/boards/boards.json'
      - 'hardware/enclosure/previews/**'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest non-draft, non-prerelease release.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build the site
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: node site/build.mjs --release "$RUNNER_TEMP/release" --version "$TAG" --out site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
