name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Keyra to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, Firmware, Hardware or enclosure, Security, Documentation, Other]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This keeps the physical button press as the only way anything gets typed.
          required: true
